name: Update RSS feed

on:
  schedule:
    - cron: "5 * * * *"   # elk uur, om :05 (de minuut wijkt af om de scheduler-piek te vermijden)
  workflow_dispatch:       # handmatig draaien via de GitHub-website

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository ophalen
        uses: actions/checkout@v5

      - name: Python installeren
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Feed bouwen
        run: python nos_teletekst.py

      - name: Wijzigingen committen en pushen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/feed.xml seen.json
          if git diff --staged --quiet; then
            echo "Geen wijzigingen in de feed."
          else
            git commit -m "Feed bijgewerkt ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
